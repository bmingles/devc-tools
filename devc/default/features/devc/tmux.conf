set -g set-titles on
set -g set-titles-string "#{session_name}"

# Pass modified keys (Shift/Ctrl/Alt+Enter) through to apps that request them,
# e.g. the Claude CLI. `on` only affects apps that opt in, unlike `always`,
# which breaks Ctrl+H/Ctrl+I/Ctrl+M in editors.
#
# Running this tmux inside a host tmux nests them, and every hop must
# opt in independently — the host needs `extended-keys on` too, or modified keys
# never reach this one. The client's TERM is whatever `devc` propagates from the
# host (tmux-256color, xterm, ...), and terminfo may carry no extkeys capability,
# so match any terminal and tell tmux it's supported before it enables the mode.
set -s extended-keys on
set -as terminal-features '*:extkeys'

# Match the host's encoding — a CLI that works outside the container and not
# inside it, purely because the two tmux servers report keys differently, is a
# miserable thing to debug.
set -s extended-keys-format csi-u
